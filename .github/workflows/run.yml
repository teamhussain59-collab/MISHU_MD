name: MISHU MD - GitHub Run

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-smoke-test:
    name: Verify and start MISHU MD safely
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run automated tests
        run: npm test

      - name: Start MISHU MD smoke test
        env:
          BOT_SMOKE_TEST: 'true'
          LOG_LEVEL: info
        run: npm start

      - name: Confirm no private runtime files are tracked
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|auth_info|sessions?)(/|$)|\.env$'; then
            echo "::error::Private environment or WhatsApp session files must not be committed."
            exit 1
          fi
          echo "No tracked environment or session files found."

      - name: GitHub-only result
        run: echo "MISHU MD startup smoke test completed. No WhatsApp login, pairing code, or external deployment was performed."
